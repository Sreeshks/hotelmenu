services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Adoxhosting@123}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_menu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel_user} -d ${POSTGRES_DB:-hotel_menu}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - PROJECT_NAME=Hotel Digital Menu API
      - ENVIRONMENT=production
      - DEBUG=false
      - POSTGRES_USER=${POSTGRES_USER:-hotel_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Adoxhosting@123}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-hotel_menu}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-insecure_change_me_super_secret_jwt_key_32chars}

      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - FRONTEND_URL=${FRONTEND_URL:-https://menu.orcux.co.in}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://menu.orcux.co.in,http://localhost:3000,http://localhost:3001}
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE_MB=15
      - IMGBB_API_KEY=${IMGBB_API_KEY:-34b1022bc8d3afbe2dc9875cba76714d}
      - UPLOAD_STORAGE_TYPE=${UPLOAD_STORAGE_TYPE:-imgbb}
      - AUTO_SEED=${AUTO_SEED:-true}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hotel-network

  frontend:
    build:
      context: ./Fontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1/ws}
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    restart: always
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    depends_on:
      - backend
    networks:
      - hotel-network

  adminpanel:
    build:
      context: ./Adminpanel
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1/ws}
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        - NEXT_PUBLIC_CUSTOMER_MENU_URL=${NEXT_PUBLIC_CUSTOMER_MENU_URL:-https://menu.orcux.co.in}
    restart: always
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    depends_on:
      - backend
    networks:
      - hotel-network

volumes:
  postgres_data:
  backend_uploads:

networks:
  hotel-network:
    driver: bridge
